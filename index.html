
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Omoikane: Bio-Gastronomo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.3);
            --header-bg: rgba(0, 0, 0, 0.8);
            --sub-bg: rgba(255, 255, 255, 0.05);
            --accent-glow: rgba(255, 255, 255, 0.05);
            --crt-opacity: 0.02;
        }

        [data-theme='light'] {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: rgba(0, 0, 0, 0.3);
            --header-bg: rgba(255, 255, 255, 0.8);
            --sub-bg: rgba(0, 0, 0, 0.05);
            --accent-glow: rgba(0, 0, 0, 0.02);
            --crt-opacity: 0.01;
        }

        html {
            scrollbar-gutter: stable;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: auto;
            min-width: 320px;
        }

        .retro-crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(128, 128, 128, var(--crt-opacity)) 50%);
            z-index: 100;
            background-size: 100% 4px;
            pointer-events: none;
        }

        .glow-border {
            border: 1px solid var(--border-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .header-font {
            font-family: 'Orbitron', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-color);
        }

        .theme-transition {
            transition: all 0.3s ease;
        }

        @keyframes voice-pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; border-color: #ff0000; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        .recording-pulse {
            animation: voice-pulse 1.5s infinite;
            color: #ff0000 !important;
        }

        @keyframes loading-scan {
          0%, 100% { transform: translateY(-50px); opacity: 0; }
          50% { transform: translateY(50px); opacity: 0.4; }
        }
        @keyframes loading-progress {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }

        pre, code, .scroll-x-safe {
            overflow-x: auto;
            max-width: 100%;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "jspdf": "https://esm.sh/jspdf@^2.5.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="retro-crt relative min-h-screen">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
